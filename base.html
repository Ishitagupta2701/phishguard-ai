<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PhishGuard AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="{{ url_for('index') }}">🛡️ PhishGuard <span>AI</span></a>
      <nav>
        <a href="{{ url_for('index') }}">Scanner</a>
        <a href="{{ url_for('history') }}">History</a>
        <a href="{{ url_for('about') }}">How it works</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container footer">
    PhishGuard AI &middot; Educational project &middot; Never rely on a single tool for security decisions.
  </footer>
</body>
</html>
